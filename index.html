<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo Umbrales</title>
    <!-- Tipografía mística y elegante de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0814;
            color: #ffffff;
            font-family: 'Cinzel', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .card-container {
            width: 340px;
            height: 530px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 25px;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #1a0f2b;
            border: 1px solid #a879e6;
        }
        .card-back {
            background: linear-gradient(135deg, #1d112b, #2b1740);
            font-size: 1.1rem;
            color: #d1b3ff;
            letter-spacing: 1px;
        }
        .card-front {
            background-color: #0d0814;
            transform: rotateY(180deg);
        }
        /* Ajuste para que las fotos queden perfectamente centradas y adaptadas */
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Centra y ajusta la imagen sin recortar ni estirar */
            border-radius: 12px;
            display: block;
        }
        button {
            background-color: #6a349c;
            color: #ffffff;
            border: 1px solid #a879e6;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(106, 52, 156, 0.4);
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>UMBRALES</h1>

    <div class="card-container" onclick="sacarCarta()">
        <!-- Arranca girada para mostrar la cara frontal con la portada -->
        <div class="card flipped" id="cartaMazo">
            <div class="card-face card-back">Toca para consultar</div>
            <div class="card-face card-front">
                <img id="imagenCarta" src="umb.0.png" alt="Carátula de bienvenida">
            </div>
        </div>
    </div>

    <button onclick="sacarCarta()">Sacar una carta</button>

    <script>
        // Lista con las cartas del mazo (sin la portada)
        const cartas = [
            "umb.1.png",
            "umb.2.png",
            "umb.3.png",
            "umb.4.png",
            "umb.5.png",
            "umb.6.png",
            "umb.7.png",
            "umb.8.png",
            "umb.9.png",
            "umb.10.png",
            "umb.11.png",
            "umb.12.png",
            "umb.13.png",
            "umb.14.png",
            "umb.15.png",
            "umb.16.png",
            "umb.17.png",
            "umb.18.png",
            "umb.19.png",
            "umb.20.png",
            "umb.21.png",
            "umb.22.png",
            // Agregá acá todas las demás fotos que tengas
        ];

        function sacarCarta() {
            const cardElement = document.getElementById('cartaMazo');
            const imgElement = document.getElementById('imagenCarta');

            cardElement.classList.remove('flipped');
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * cartas.length);
                imgElement.src = cartas[randomIndex];
                cardElement.classList.add('flipped');
            }, 300);
        }
    </script>
</body>
</html>
