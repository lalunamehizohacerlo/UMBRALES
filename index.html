<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo Umbrales</title>
    <!-- Tipografía mística y elegante de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Fondo con gradiente místico */
        body {
            background: radial-gradient(circle at center, #1b0f2e 0%, #0d0814 100%);
            color: #ffffff;
            font-family: 'Cinzel', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Capa de destellos flotantes en el fondo */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #e3c5ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, #b8860b, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #d1b3ff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.35;
            animation: destellosFlotantes 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes destellosFlotantes {
            from { background-position: 0 0; }
            to { background-position: 0 -400px; }
        }

        /* Botón flotante para la música */
        #btnMusica {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(106, 52, 156, 0.6);
            color: #ffffff;
            border: 1px solid #a879e6;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-family: 'Cinzel', serif;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }

        #btnMusica:hover {
            background: rgba(130, 66, 194, 0.9);
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 10px;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(209, 179, 255, 0.5);
            z-index: 1;
        }

        /* CARTA AGRANDADA CON RESPLANDOR / HALO QUE RESPIRA */
        .card-container {
            width: 88vw;
            max-width: 360px;
            height: 138vw;
            max-height: 560px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 25px;
            z-index: 1;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 16px;
            animation: haloMistico 3.5s ease-in-out infinite alternate;
        }

        @keyframes haloMistico {
            0% {
                box-shadow: 0 0 15px rgba(168, 121, 230, 0.3), 0 0 30px rgba(106, 52, 156, 0.2);
            }
            100% {
                box-shadow: 0 0 25px rgba(209, 179, 255, 0.7), 0 0 50px rgba(168, 121, 230, 0.5);
            }
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Dorso místico limpio */
        .card-back {
            background: radial-gradient(circle, #2b1740 0%, #150b21 100%);
            border: 2px solid #a879e6;
        }

        .card-back::after {
            content: "✦";
            font-size: 2.5rem;
            color: rgba(209, 179, 255, 0.4);
            text-shadow: 0 0 10px rgba(209, 179, 255, 0.6);
        }

        .card-front {
            background-color: #000;
            transform: rotateY(180deg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000000;
            border-radius: 16px;
        }

        .btn-sacar {
            background-color: #6a349c;
            color: #ffffff;
            border: 1px solid #a879e6;
            padding: 14px 32px;
            font-size: 1rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(106, 52, 156, 0.5);
            transition: all 0.3s ease;
            margin-bottom: 15px;
            z-index: 1;
        }

        .btn-sacar:hover {
            background-color: #8242c2;
            box-shadow: 0 0 20px rgba(168, 121, 230, 0.8);
        }

        .btn-sacar:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Elemento de audio oculto -->
    <audio id="musicaFondo" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Botón flotante para activar o pausar la música -->
    <button id="btnMusica" onclick="toggleMusica()">🎵 Música: OFF</button>

    <h1>UMBRALES</h1>

    <div class="card-container" onclick="sacarCarta()">
        <div class="card flipped" id="cartaMazo">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">
                <img id="imagenCarta" src="umb.0.png" alt="Carátula de bienvenida">
            </div>
        </div>
    </div>

    <button class="btn-sacar" onclick="sacarCarta()">Sacar una carta</button>

    <script>
        const imagenPortada = "umb.0.png";

        const cartas = [
            "umb.1.png",
            "umb.2.png",
            "umb.3.png",
            "umb.4.png",
            "umb.5.png",
            "umb.6.png",
            "umb.7.png",
            "umb.8.png",
            "umb.9.png",
            "umb.10.png",
            "umb.11.png",
            "umb.12.png",
            "umb.13.png",
            "umb.14.png",
            "umb.15.png",
            "umb.16.png",
            "umb.17.png",
            "umb.18.png",
            "umb.19.png",
            "umb.20.png",
            "umb.21.png",
            "umb.22.png",
        ];

        function sacarCarta() {
            const cardElement = document.getElementById('cartaMazo');
            const imgElement = document.getElementById('imagenCarta');

            cardElement.classList.remove('flipped');
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * cartas.length);
                imgElement.src = cartas[randomIndex];
                cardElement.classList.add('flipped');
            }, 350);
        }

        function toggleMusica() {
            const audio = document.getElementById('musicaFondo');
            const btn = document.getElementById('btnMusica');

            if (audio.paused) {
                audio.play();
                btn.innerHTML = "🎵 Música: ON";
                btn.style.background = "rgba(130, 66, 194, 0.9)";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Música: OFF";
                btn.style.background = "rgba(106, 52, 156, 0.6)";
            }
        }
    </script>
</body>
</html>
